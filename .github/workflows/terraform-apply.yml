name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"

  # Allow manual trigger (e.g. first deploy, forced re-apply)
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'apply' to confirm"
        required: true
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    # Guard manual trigger — require explicit confirmation
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'apply')

    uses: 0451-software/reusable-workflows/.github/workflows/terraform-apply.yml@v1
    with:
      working_directory: terraform
      project_name: ${{ vars.PROJECT_NAME || 'openclaw' }}
      environment: production
    secrets: inherit