name: Terraform Plan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write  # to post plan as PR comment
  id-token: write

jobs:
  plan:
    uses: ./.github/workflows/_reusable-terraform-plan.yml
    with:
      working_directory: terraform
      project_name: ${{ vars.PROJECT_NAME || 'openclaw' }}
    secrets: inherit